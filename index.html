<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="El sitio de Rubén Olivier está en mantenimiento. Diseño visual, identidad de marca y UX/UI. Hablemos de tu proyecto.">
<title>En mantenimiento · Rubén Olivier</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--background:#1b1b1b;--text:#f1f2f0;--muted:#b8bab6;--line:#444641;--pad:clamp(24px,4.5vw,80px);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:500 18px/1.5 Geist,Arial,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--text);outline-offset:8px}::selection{background:var(--text);color:var(--background)}
.page{min-height:100vh;min-height:100svh;padding:clamp(28px,4vw,64px) var(--pad) 24px;display:flex;flex-direction:column;gap:clamp(64px,10vh,120px)}
.brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:32px}.symbol{display:block;width:64px;height:auto}.wordmark{display:block;width:clamp(148px,16vw,235px);height:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}h1{font:400 clamp(27px,8.5vw,164px)/.98 Arial,Helvetica,sans-serif;letter-spacing:-.065em;margin:0}h1>span{display:block;overflow:hidden;padding-bottom:.1em}h1 .line{display:block;animation:enter 1.2s var(--ease) both}h1>span:nth-child(2) .line{animation-delay:.13s}
.contact{border-top:1px solid var(--line);padding-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end}.intro{max-width:410px;margin:0;color:var(--muted)}.email{justify-self:end;display:inline-flex;align-items:center;gap:32px;border-bottom:1px solid var(--text);padding-bottom:10px;font-size:clamp(18px,2.1vw,30px);letter-spacing:-.04em}.arrow{transition:transform .35s var(--ease)}.email:hover .arrow,.email:focus-visible .arrow{transform:translate(4px,-4px)}
footer{display:flex;justify-content:space-between;align-items:center;gap:24px;border-top:1px solid var(--line);padding-top:22px;font-size:14px;color:var(--muted)}footer p{margin:0}.socials{display:flex;gap:24px}.socials a:hover{text-decoration:underline;text-underline-offset:5px}
@keyframes enter{from{transform:translateY(115%)}to{transform:translateY(0)}}
@media(max-width:640px){body{font-size:17px}.page{gap:64px}.symbol{width:52px}main{gap:32px}.contact{grid-template-columns:1fr;gap:28px}.email{justify-self:start;gap:24px}footer{align-items:flex-start;flex-direction:column;gap:16px}.socials{gap:20px}}
@media(prefers-reduced-motion:reduce){h1 .line{animation:none}.arrow{transition:none}}
</style>
</head>
<body>
<div class="page">
<header class="brand-row" aria-label="Rubén Olivier">
<img class="symbol" src="assets/brand/symbol.png" width="476" height="258" alt="Isotipo de Rubén Olivier">
<img class="wordmark" src="assets/brand/wordmark.png" width="315" height="141" alt="Rubén Olivier">
</header>
<main id="main">
<h1><span><span class="line">EN</span></span><span><span class="line">MANTENIMIENTO.</span></span></h1>
<div class="contact">
<p class="intro">Estoy afinando los últimos detalles de mi sitio. Mientras tanto, hablemos de tu proyecto.</p>
<a class="email" href="mailto:hola@rubenolivier.com">hola@rubenolivier.com <span class="arrow" aria-hidden="true">↗</span></a>
</div>
</main>
<footer>
<p>© 2026 Rubén Olivier · México</p>
<nav class="socials" aria-label="Redes sociales"><a href="https://www.linkedin.com/in/ruben-olivier/">LinkedIn ↗</a><a href="https://www.behance.net/ruben-olivier">Behance ↗</a><a href="https://www.instagram.com/ux_rolivier/">Instagram ↗</a></nav>
</footer>
</div>
</body>
</html>
